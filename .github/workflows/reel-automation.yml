name: Dreams Automated Reels
on:
  schedule:
    # 11:30 AM / 11:30 PM IST. GitHub schedules may be delayed.
    - cron: "0 6,18 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to run"
        required: true
        default: production
        type: choice
        options:
          - production
          - resume_retry
          - reset_sheet_drafts
          - social_inventory
          - facebook_rebrand_hide
          - youtube_rebrand_unlist
  repository_dispatch:
    types: [approval-decision]
permissions:
  contents: read
concurrency:
  group: dreams-production
  cancel-in-progress: false
jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AUTOMATION_BUDGET_MINUTES: "120"
      PUPPETEER_SKIP_DOWNLOAD: "true"
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_FOR_VISUALS: ${{ secrets.GEMINI_API_KEY_FOR_VISUALS }}
      GEMINI_SCRIPT_MODEL: "gemini-2.5-flash-lite"
      GEMINI_VISUAL_MODEL: "gemini-2.5-flash"
      ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET || 'videos' }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
      VOICEBOX_REFERENCE_TEXT: ${{ secrets.VOICEBOX_REFERENCE_TEXT }}
      VOICEBOX_MODEL_SIZE: "1.7B"
      PYTHON_EXECUTABLE: python
      APPROVAL_TTL_HOURS: "72"
      APPROVAL_ID: ${{ github.event.client_payload.approval_id || '' }}
    steps:
      - name: Record total job budget start
        run: echo "AUTOMATION_STARTED_AT_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install and check TypeScript modules
        run: npm ci && npm run typecheck:automation
      - name: Process an approved or rejected review
        if: github.event_name == 'repository_dispatch' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'production')
        id: approval
        run: npm run approval:process
      - name: Validate provider credentials without publishing
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'production' && steps.approval.outputs.handled != 'true'
        run: npm run diagnose:credentials
      - name: Back up and reset Sheet with niche drafts
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'reset_sheet_drafts'
        run: npm run admin:reset-sheet-drafts
      - name: Unpause and safely requeue first failed Sheet row
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'resume_retry'
        run: npm run admin:resume-retry
      - name: Upload Sheet backup
        if: always() && github.event_name == 'workflow_dispatch' && inputs.operation == 'reset_sheet_drafts'
        uses: actions/upload-artifact@v4
        with:
          name: sheet-backup-${{ github.run_id }}
          path: .sheet-admin-backup
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Inventory social accounts without changes
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'social_inventory'
        run: npm run admin:social-inventory
      - name: Upload social inventory
        if: always() && github.event_name == 'workflow_dispatch' && inputs.operation == 'social_inventory'
        uses: actions/upload-artifact@v4
        with:
          name: social-inventory-${{ github.run_id }}
          path: .social-admin
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Rebrand Facebook and hide old posts
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'facebook_rebrand_hide'
        run: npm run admin:facebook-rebrand-hide
      - name: Upload Facebook change report
        if: always() && github.event_name == 'workflow_dispatch' && inputs.operation == 'facebook_rebrand_hide'
        uses: actions/upload-artifact@v4
        with:
          name: facebook-rebrand-hide-${{ github.run_id }}
          path: .social-admin
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Update YouTube description and unlist old videos
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'youtube_rebrand_unlist'
        run: npm run admin:youtube-rebrand-unlist
      - name: Upload YouTube change report
        if: always() && github.event_name == 'workflow_dispatch' && inputs.operation == 'youtube_rebrand_unlist'
        uses: actions/upload-artifact@v4
        with:
          name: youtube-rebrand-unlist-${{ github.run_id }}
          path: .social-admin
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Check Sheet control and eligibility before expensive setup
        if: github.event_name != 'repository_dispatch' && steps.approval.outputs.handled != 'true' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'production')
        id: gate
        run: node --import tsx src/automation/gate.ts
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: voicebox/requirements-automation.txt
      - name: System media tools
        if: steps.gate.outputs.ready == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Browser renderer
        if: steps.gate.outputs.ready == 'true'
        run: npx playwright install chromium --with-deps
      - name: CPU voice engine
        if: steps.gate.outputs.ready == 'true'
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r voicebox/requirements-automation.txt
      - name: Cache model downloads only
        if: steps.gate.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: qwen-cpu-${{ runner.os }}-${{ hashFiles('voicebox/requirements-automation.txt') }}-1.7B
      - name: Run one automated task
        if: steps.gate.outputs.ready == 'true'
        id: production
        run: npm run automation
      - name: Upload generated primitive reviews
        if: always() && steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: primitive-reviews-${{ github.run_id }}
          path: .primitive-reviews
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
      - name: Report setup failure before production
        if: failure() && (github.event_name != 'workflow_dispatch' || inputs.operation == 'production') && steps.production.outcome == 'skipped'
        run: node --import tsx src/automation/setup-failure.ts
      - name: In-job last-resort temporary cleanup
        if: always()
        run: |
          # Only this run's isolated generated workspaces. No source assets or model caches.
          node -e "require('node:fs').rmSync('.automation-runs', {recursive:true,force:true})"
